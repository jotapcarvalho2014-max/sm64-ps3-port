name: Build SM64 PS3
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: bucanero/ps3dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cp bin/baserom.us.z64 ./baserom.us.z64
          make COMPARE=0
      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: sm64-ps3-pkg
          path: ./*.pkg
