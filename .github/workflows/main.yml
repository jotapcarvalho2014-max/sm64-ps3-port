name: Build SM64 PS3
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Base Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 wget vbindiff libelf-dev

      - name: Setup PS3 SDK
        run: |
          git clone --depth 1 https://github.com/ps3dev/ps3dev.git ps3dev-repo
          echo "PS3DEV=/usr/local/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=/usr/local/ps3dev/psl1ght" >> $GITHUB_ENV
          echo "/usr/local/ps3dev/bin" >> $GITHUB_PATH

      - name: Build SM64 PKG
        run: |
          # Coloca a ROM no lugar certo
          cp bin/baserom.us.z64 ./baserom.us.z64
          # Tenta compilar ignorando erros de hash
          make COMPARE=0 -j$(nproc)
          
      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: sm64-ps3-pkg
          path: ./*.pkg

